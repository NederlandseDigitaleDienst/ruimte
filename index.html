<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages stuurt geen eigen headers, dus het beleid staat hier.
     connect-src 'none': niets op deze pagina mag naar buiten praten.
     form-action 'none': het wachtwoordformulier kan nergens heen, ook niet
     als preventDefault ooit faalt. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Ruimte</title>
<!-- Integriteitshashes van de vastgepinde versie. Alles op deze pagina
     vertrouwt dit script: het ziet de ontgrendelde plaat. Bij een upgrade
     de hashes opnieuw berekenen:
     curl -sL URL | openssl dgst -sha384 -binary | openssl base64 -A -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nldd/design-system@0.8.88/dist/css/global.css"
      integrity="sha384-xwQZUA7Pji2PW+dds5Ilgk0jxggoGy5vHc+YFUapXEFZpS7ToJPA9nr6I2bjoG+u"
      crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@nldd/design-system@0.8.88/dist/nldd.min.js"
        integrity="sha384-Ukt/9hzGcpGTosUAgrt3Z0Hku8/UC4j2zy2KTA+Ik/XyjPj61z4hCPw4mi9BvXZ+"
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="src/app.css">
</head>
<body>

<!-- Het wachtwoordscherm. Ondoorzichtig, want achter een doorschijnende laag
     zijn de namen op de plaat nog te lezen. -->
<div id="slot" class="slot" hidden></div>

<nldd-app-view>
  <nldd-navigation-split-view
    id="shell"
    primary-sidebar-accessible-label="Scenario's en toets"
    inspector-accessible-label="Details">

    <!-- Links: weergave kiezen, scenario's en de toets. De skip-link slaat
         dit hele blok over voor wie met het toetsenbord werkt. -->
    <nldd-split-view-pane slot="primary-sidebar">
      <nldd-page background="tinted">
       <nldd-skip-link text="Direct naar de inhoud" href="hoofd">
        <nldd-container padding="16" gap="16" layout="stack">

          <!-- De vier weergaven. Navigatie hoort links, niet in een werkbalk. -->
          <nldd-list id="view-lijst" variant="box" type="navigation"
                     accessible-label="Weergave"></nldd-list>

          <nldd-divider></nldd-divider>

          <nldd-container layout="stack" gap="4" padding="0">
            <nldd-title size="5"><h2>Scenario's</h2></nldd-title>
            <nldd-text size="sm" color="secondary">
              Varianten op dezelfde mensen en dezelfde opgave.
            </nldd-text>
          </nldd-container>

          <nldd-list id="scenario-lijst" variant="box" type="navigation"
                     accessible-label="Scenario's"></nldd-list>

          <nldd-button id="scenario-toevoegen" variant="secondary" size="sm"
                       start-icon="plus" text="Scenario erbij"></nldd-button>

          <nldd-divider></nldd-divider>

          <nldd-container layout="stack" gap="4" padding="0">
            <nldd-title size="5"><h2>Toets</h2></nldd-title>
            <nldd-text size="sm" color="secondary">
              Herberekent bij elke wijziging.
            </nldd-text>
          </nldd-container>

          <nldd-list id="toets-lijst" variant="box" type="list"
                     accessible-label="Toetsresultaten"></nldd-list>

        </nldd-container>
       </nldd-skip-link>
      </nldd-page>
    </nldd-split-view-pane>

    <!-- Midden: de plaat zelf. -->
    <nldd-split-view-pane slot="main">
      <nldd-page id="hoofd">

        <nldd-top-title-bar slot="header" id="titelbalk">
          <nldd-toolbar slot="toolbar" size="md" label="Acties">
            <nldd-toolbar-item slot="end">
              <nldd-button id="undo" variant="neutral-tinted" size="sm"
                           start-icon="arrow-2-counter-clockwise"
                           text="Ongedaan maken"></nldd-button>
            </nldd-toolbar-item>
            <nldd-toolbar-item slot="end">
              <nldd-button id="exporteer" variant="neutral-tinted" size="sm"
                           start-icon="download" text="Exporteren"></nldd-button>
            </nldd-toolbar-item>
            <nldd-toolbar-item slot="end">
              <nldd-button id="importeer" variant="neutral-tinted" size="sm"
                           start-icon="upload" text="Importeren"></nldd-button>
            </nldd-toolbar-item>
            <nldd-toolbar-item slot="end">
              <nldd-button id="leegmaken" variant="neutral-tinted" size="sm"
                           start-icon="delete" text="Leeg beginnen"></nldd-button>
            </nldd-toolbar-item>
            <nldd-toolbar-item slot="end">
              <nldd-button id="vergrendel" variant="neutral-tinted" size="sm"
                           start-icon="lock" text="Op slot"></nldd-button>
            </nldd-toolbar-item>
          </nldd-toolbar>
        </nldd-top-title-bar>

        <div id="view"></div>
      </nldd-page>
    </nldd-split-view-pane>

    <!-- Rechts: details van wat je aanklikt. Verdwijnt eerst op smal scherm. -->
    <nldd-split-view-pane slot="inspector">
      <nldd-page background="tinted">
        <div id="inspector"></div>
      </nldd-page>
    </nldd-split-view-pane>

  </nldd-navigation-split-view>
</nldd-app-view>

<!-- Sheet voor het bewerken van een plek. Hoort in body, niet in een pane. -->
<nldd-sheet id="plek-sheet" placement="right" width="480px"
            accessible-label="Plek bewerken">
  <div id="plek-sheet-inhoud"></div>
</nldd-sheet>

<nldd-sheet id="persoon-sheet" placement="right" width="480px"
            accessible-label="Persoon bewerken">
  <div id="persoon-sheet-inhoud"></div>
</nldd-sheet>

<nldd-sheet id="eenheid-sheet" placement="right" width="480px"
            accessible-label="Team bewerken">
  <div id="eenheid-sheet-inhoud"></div>
</nldd-sheet>

<nldd-sheet id="scenario-sheet" placement="right" width="480px"
            accessible-label="Scenario bewerken">
  <div id="scenario-sheet-inhoud"></div>
</nldd-sheet>

<input type="file" id="import-bestand" accept="application/json" hidden>

<script type="module" src="src/app.js"></script>
</body>
</html>
